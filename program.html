<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cubs S&amp;C</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="js/training-core.js?v=4"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#060810; --surface:#0C1018; --surface2:#121826; --surface3:#182033;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.14);
  --text:#F4F6FF; --text2:#9AA3BA; --text3:#5A6680;
  --blue:#1A4FCC; --blue-l:#5B8CF5; --blue-xl:#A8C4FA;
  --green-l:#4ADE80; --amber-l:#FCD34D; --red-l:#F87171;
  --pair-A:#C4B5FD; --pair-B:#5EEAD4; --pair-C:#FDE68A; --pair-D:#F9A8D4; --pair-E:#93C5FD; --pair-F:#FCA5A1; --pair-G:#FDBA74; --pair-H:#A5B4FC;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;overscroll-behavior-y:none;}
body{padding-bottom:calc(150px + var(--safe-b));}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:310;display:flex;justify-content:center;padding:4px 12px calc(4px + var(--safe-b));background:rgba(6,8,16,0.98);border-top:1px solid var(--border);}
.tabbar button{flex:1;max-width:220px;background:none;border:none;color:var(--text3);font-size:11px;font-weight:700;letter-spacing:.04em;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;cursor:pointer;}
.tabbar button .ti{font-size:20px;line-height:1.1;filter:grayscale(1);opacity:.7;}
.tabbar button.on{color:var(--blue-xl);}
.tabbar button.on .ti{filter:none;opacity:1;}
.tabbar .tdot{position:absolute;top:5px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:#f87171;box-shadow:0 0 0 2px rgba(6,8,16,1);}
button{font-family:inherit;}
input,textarea{font-family:inherit;}

/* Top bar */
.topbar{height:54px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;background:rgba(6,8,16,0.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:10px;}
.brand-logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#1A3B7A,#0E2355);display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid rgba(255,255,255,0.12);}
.brand-text .t1{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.12em;color:#fff;line-height:1;}
.brand-text .t2{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-top:2px;}
.top-right{display:flex;align-items:center;gap:10px;}
.sync{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.02em;white-space:nowrap;}
.sync.ok{color:var(--green-l);} .sync.off{color:var(--amber-l);}
.ring-svg{transform:rotate(-90deg);display:block;}
.ring-track{fill:none;stroke:rgba(255,255,255,0.07);stroke-width:3;}
.ring-prog{fill:none;stroke:var(--blue-l);stroke-width:3;stroke-linecap:round;stroke-dasharray:82;stroke-dashoffset:82;transition:stroke-dashoffset .4s ease;}

/* Hero */
.hero{padding:18px 16px 14px;background:linear-gradient(175deg,rgba(26,79,204,0.24) 0%,rgba(6,8,16,0) 75%);}
.hero-date{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-l);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.today-pill{background:var(--blue-l);color:#fff;border-radius:100px;padding:2px 8px;font-size:9px;letter-spacing:.1em;}
.hero-name{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.03em;line-height:.95;color:#fff;}
.hero-prog{font-size:13px;color:var(--text2);margin-top:4px;}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.chip{font-size:11px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:4px 10px;}
.coach-note{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(91,140,245,0.08);border:1px solid rgba(91,140,245,0.22);font-size:13px;line-height:1.5;color:var(--blue-xl);}
.coach-note b{color:#fff;}

/* Week + day selectors */
.nav{position:sticky;top:54px;z-index:150;background:rgba(6,8,16,0.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);}
.week-row,.day-row{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none;}
.day-row{padding:10px 16px 12px;gap:8px;}
.week-row::-webkit-scrollbar,.day-row::-webkit-scrollbar{display:none;}
.wtab{flex-shrink:0;font-size:12px;font-weight:700;padding:7px 14px;border-radius:100px;color:var(--text2);background:transparent;border:1px solid var(--border2);letter-spacing:.02em;cursor:pointer;}
.wtab.active{background:var(--blue-l);color:#fff;border-color:transparent;}
.wtab.deload{color:var(--amber-l);border-color:rgba(252,211,77,.3);}
.wtab.deload.active{background:rgba(180,83,9,.55);color:#fff;}
.day-card{flex-shrink:0;min-width:64px;padding:8px 10px;border-radius:12px;text-align:center;border:1px solid var(--border);background:var(--surface);cursor:pointer;position:relative;}
.day-card .d1{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}
.day-card .d2{font-size:11px;font-weight:600;color:var(--text2);margin-top:3px;max-width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.day-card.active{border-color:var(--blue-l);background:rgba(91,140,245,0.14);}
.day-card.active .d1,.day-card.active .d2{color:#fff;}
.day-card.off{opacity:.45;cursor:default;}
.day-card.done::after{content:'✓';position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--green-l);color:#06240f;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.day-card.today .d1{color:var(--blue-l);}
.day-card.today::before{content:'';position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--blue-l);}

/* Session */
.session{padding:14px 12px 20px;max-width:720px;margin:0 auto;}
.sess-title{display:flex;align-items:baseline;justify-content:space-between;padding:4px 4px 12px;}
.sess-title h2{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.04em;color:#fff;font-weight:400;}
.sess-title span{font-size:11px;color:var(--text3);font-weight:600;}
.divider{display:flex;align-items:center;gap:10px;margin:18px 4px 12px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green-l);}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border2);}
.block{margin-bottom:18px;}
.block-head{display:flex;align-items:center;gap:8px;padding:0 4px 8px;}
.block-head .bi{font-size:15px;}
.block-head .bn{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.06em;color:#fff;}
.block-head .bc{margin-left:auto;font-size:10px;color:var(--text3);font-weight:700;letter-spacing:.08em;}
.group{border-radius:16px;background:var(--surface);border:1px solid var(--border);margin-bottom:10px;overflow:hidden;}
.group-head{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.04em;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.02);}
.group-head .gl{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0b0f18;}
.ex{padding:14px 14px 12px;border-bottom:1px solid var(--border);}
.ex:last-child{border-bottom:none;}
.ex-top{display:flex;gap:12px;align-items:flex-start;}
.ex-tag{flex-shrink:0;min-width:30px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0b0f18;margin-top:1px;}
.ex-tag.none{background:var(--surface3);color:var(--text3);}
.ex-main{flex:1;min-width:0;}
.ex-name{font-size:16px;font-weight:700;color:#fff;line-height:1.25;}
.ex-rx{margin-top:4px;font-family:'DM Mono',monospace;font-size:14px;color:var(--blue-xl);font-weight:500;}
.ex-rx b{color:#fff;font-weight:600;}
.ex-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.ex-chips span{font-size:11px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:3px 8px;font-family:'DM Mono',monospace;}
.vid{flex-shrink:0;width:64px;height:48px;border-radius:10px;overflow:hidden;position:relative;background:var(--surface3);border:1px solid var(--border2);cursor:pointer;}
.vid img{width:100%;height:100%;object-fit:cover;opacity:.85;}
.vid::after{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.7);}
.ex-note{margin-top:10px;font-size:13px;line-height:1.5;color:var(--text2);padding:8px 10px;background:var(--surface2);border-radius:10px;border-left:3px solid var(--blue-l);}
.ex-last{margin-top:8px;font-size:12px;color:var(--text3);}
.ex-last b{color:var(--text2);font-family:'DM Mono',monospace;font-weight:500;}

/* Set rows */
.sets{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.set{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;align-items:center;}
.set.simple{grid-template-columns:34px 1fr 52px;}
.set-n{font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);text-align:center;}
.fld{position:relative;}
.fld input{width:100%;height:46px;border-radius:12px;border:1px solid var(--border2);background:var(--surface2);color:#fff;font-size:17px;font-weight:600;text-align:center;padding:0 28px 0 8px;font-family:'DM Mono',monospace;-moz-appearance:textfield;}
.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.fld input::placeholder{color:#7C88A6;font-weight:500;}
.fld input:focus{outline:none;border-color:var(--blue-l);background:#16203a;}
.fld .u{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text3);pointer-events:none;text-transform:uppercase;letter-spacing:.06em;}
.set-rx{height:46px;border-radius:12px;border:1px dashed var(--border2);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:14px;color:var(--text2);}
.chk{width:52px;height:46px;border-radius:12px;border:1.5px solid var(--border2);background:transparent;color:#2E3850;font-size:20px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.chk.done{background:var(--green-l);border-color:var(--green-l);color:#06240f;}
.set.done .fld input{border-color:rgba(74,222,128,.35);color:var(--green-l);}
.ex-actions{display:flex;gap:14px;margin-top:10px;}
.link{background:none;border:none;color:var(--blue-l);font-size:12px;font-weight:600;cursor:pointer;padding:4px 0;}
.note-box{margin-top:8px;display:none;}
.note-box.open{display:block;}
.note-box textarea{width:100%;min-height:62px;border-radius:12px;border:1px solid var(--border2);background:var(--surface2);color:#fff;font-size:14px;padding:10px;resize:vertical;}
.why{display:none;margin-top:10px;font-size:13px;line-height:1.55;color:var(--text2);}
.why.open{display:block;}
.why .lbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:8px 0 3px;}

.rest-day{text-align:center;padding:70px 20px;color:var(--text2);font-size:15px;}
.rest-day div{font-size:40px;margin-bottom:10px;}
.done-banner{margin:0 4px 14px;padding:12px 14px;border-radius:14px;background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.25);color:var(--green-l);font-size:13px;font-weight:600;}

/* Bottom bar + rest timer */
.bottom{position:fixed;left:0;right:0;bottom:calc(54px + var(--safe-b));z-index:300;padding:10px 12px 10px;background:rgba(6,8,16,0.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--border);}
.bottom-inner{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center;}
.btn-main{flex:1;height:52px;border-radius:14px;border:none;background:var(--blue-l);color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
.btn-main.done{background:rgba(74,222,128,.18);color:var(--green-l);}
.count{font-family:'DM Mono',monospace;font-size:13px;color:var(--text2);min-width:62px;text-align:center;}
.timer{display:none;max-width:720px;margin:0 auto 10px;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--border2);}
.timer.show{display:flex;}
.timer .tt{font-family:'DM Mono',monospace;font-size:22px;font-weight:600;color:#fff;min-width:64px;}
.timer .tl{flex:1;font-size:12px;color:var(--text2);}
.timer .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden;}
.timer .bar i{display:block;height:100%;background:var(--blue-l);width:0;}
.timer button{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:600;cursor:pointer;}
.timer.end{border-color:var(--green-l);}
.timer.end .tt{color:var(--green-l);}

/* Finish sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:none;}
.sheet-bg.open{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:401;background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--border2);padding:18px 16px calc(18px + var(--safe-b));max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;}
.sheet.open{transform:none;}
.sheet-in{max-width:620px;margin:0 auto;}
.sheet h3{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.04em;font-weight:400;color:#fff;}
.sheet .sub{font-size:13px;color:var(--text2);margin:2px 0 14px;}
.q{font-size:14px;font-weight:700;color:#fff;margin:16px 0 8px;}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.opt{padding:10px 14px;border-radius:12px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;}
.opt.on{background:rgba(91,140,245,.18);border-color:var(--blue-l);color:#fff;}
.opt.bad.on{background:rgba(248,113,113,.16);border-color:var(--red-l);}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;}
.scale button{height:42px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-weight:700;font-size:14px;cursor:pointer;}
.scale button.on{background:var(--red-l);border-color:var(--red-l);color:#2a0707;}
.sheet textarea{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--border2);background:var(--surface2);color:#fff;font-size:15px;padding:10px 12px;}
.toggle-row{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--text);}
.toggle-row input{width:22px;height:22px;accent-color:var(--blue-l);}
.sheet .actions{display:flex;gap:10px;margin-top:20px;}
.btn-ghost{height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:15px;font-weight:600;cursor:pointer;}

.ready-card{margin:0 4px 16px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid rgba(91,140,245,0.3);}
.ready-card .rc-t{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;color:#fff;}
.ready-card .rc-t span{font-family:'Inter',sans-serif;font-size:11px;color:var(--text3);letter-spacing:0;margin-left:6px;}
.ready-card .q{margin:12px 0 7px;font-size:13px;}
.ready-card .opt{padding:9px 12px;font-size:13px;}
.actions{display:flex;gap:10px;}
.ready-bar{margin:0 4px 14px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border2);font-size:13px;color:var(--text2);}
.ready-bar b{color:#fff;}
.ready-bar.lvl-yellow{border-color:rgba(252,211,77,.35);} .ready-bar.lvl-red{border-color:rgba(248,113,113,.4);}
.ready-why{font-size:11px;color:var(--text3);margin-top:3px;}
.ex.skip{opacity:.75;}
.loading{text-align:center;padding:100px 24px;color:var(--text3);}
.spin{width:28px;height:28px;border:2px solid rgba(255,255,255,0.08);border-top-color:var(--blue-l);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg)}}
.err{margin:24px 16px;padding:20px;border-radius:14px;text-align:center;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.18);color:#FCA5A5;font-size:14px;line-height:1.7;}

/* ── Print / PDF — weeks side by side ── */
.print-btn{background:transparent;border:1px solid rgba(255,255,255,0.18);color:#cbd5e1;border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer;margin-right:8px;}
#print-root{display:none;}
@media print{
  @page{size:letter landscape;margin:0.35in 0.35in 0.4in;}
  html,body{background:#fff !important;}
  body > *:not(#print-root){display:none !important;}
  #print-root{display:block;color:#111;font:10px/1.25 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .sb-pg{break-after:page;page-break-after:always;}
  .sb-pg:last-child{break-after:auto;page-break-after:auto;}
  .sb-hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #0e3386;padding-bottom:5px;margin-bottom:8px;}
  .sb-hd .t{font-size:19px;font-weight:800;color:#0e3386;}
  .sb-hd .s{font-size:11.5px;color:#333;margin-top:2px;}
  .sb-hd .r{text-align:right;font-size:9.5px;color:#555;line-height:1.4;}
  .sb-msg{border-left:3px solid #cc3433;background:#fbf3f3;padding:5px 9px;margin:0 0 8px;font-size:10.5px;}
  .sb-day{break-inside:avoid;page-break-inside:avoid;margin-bottom:8px;}
  .sb-dh{display:flex;justify-content:space-between;align-items:center;background:#0e3386;color:#fff;font-weight:800;font-size:12px;padding:4px 8px;border-radius:3px 3px 0 0;}
  .sb-dh span{font-weight:600;font-size:10.5px;opacity:.9;}
  .sb-day table{width:100%;border-collapse:collapse;table-layout:fixed;}
  .sb-day th{background:#eef2fb;color:#0e3386;font-size:9px;text-transform:uppercase;letter-spacing:.03em;padding:2px 5px;border:1px solid #c9d3ea;text-align:center;}
  .sb-day th.l{text-align:left;}
  .sb-day th .dl{display:block;font-weight:600;text-transform:none;letter-spacing:0;color:#555;font-size:8.5px;}
  .sb-day td{border:1px solid #d6dbe6;padding:2px 6px;vertical-align:top;text-align:center;}
  .sb-day td.tag{font-weight:800;color:#0e3386;font-size:11px;vertical-align:middle;}
  .sb-day td.ex{text-align:left;}
  .sb-day td.ex b{font-size:11px;}
  .sb-day .cue{display:block;color:#666;font-size:8px;line-height:1.2;margin-top:0;}
  .sb-day td.mid{vertical-align:middle;font-weight:600;}
  .sb-day td.wk{text-align:left;}
  .sb-day td.wk b{font-size:11px;}
  .sb-day .ld{color:#0e3386;font-weight:700;}
  .sb-day .alt{display:block;color:#b45309;font-style:italic;font-size:9px;}
  .sb-day .chg{display:block;color:#555;font-size:8.5px;}
  .sb-day .wl{display:block;margin-top:2px;border-bottom:1px solid #9aa3b5;height:9px;}
  .sb-day tr.blk td{background:#f5f6f8;text-align:left;font-weight:700;font-size:9px;color:#333;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;}
  .sb-day tr{break-inside:avoid;page-break-inside:avoid;}
  .sb-day td.na{background:#fafafa;}
  .sb-ft{margin-top:6px;font-size:8.5px;color:#888;text-align:right;}
}
</style>
<link rel="manifest" id="pwa-manifest">

// PWA SETUP — manifest, service worker, "Add to Home Screen" prompt
// ══════════════════════════════════════════════════════════════════════════
(function(){
  // The manifest's start_url must include THIS athlete's ?id= — otherwise
  // installing the app would always relaunch to a blank/generic program page
  // instead of back to their own program. Built dynamically per-visit rather
  // than as a static file for exactly this reason.
  var params = new URLSearchParams(window.location.search);
  var pid = params.get('id') || '', ptok = params.get('a') || '';
  var startUrl = './program.html' + (ptok ? ('?a=' + encodeURIComponent(ptok)) : pid ? ('?id=' + encodeURIComponent(pid)) : '');

  var manifest = {
    name: 'Cubs S&C Training Program',
    short_name: 'Cubs S&C',
    description: 'Your strength & conditioning training program',
    start_url: startUrl,
    scope: './',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#060810',
    theme_color: '#0E2355',
    icons: [
      { src: 'icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: 'icon-192-maskable.png', sizes: '192x192', type: 'image/png', purpose: 'maskable' },
      { src: 'icon-512-maskable.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }
    ]
  };
  var manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  var manifestUrl = URL.createObjectURL(manifestBlob);
  var manifestLink = document.getElementById('pwa-manifest');
  if (manifestLink) manifestLink.setAttribute('href', manifestUrl);

  // Service worker — scoped explicitly to program.html only. Registering
  // without an explicit scope defaults to the directory containing this
  // file, which would ALSO cover index.html (the coach dashboard) sitting
  // right next to it — silently serving cached, stale copies of the coach
  // tool to anyone whose browser had ever opened an athlete's program link.
  // That was a real, live bug: this scope option is the fix.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js', { scope: './program.html' }).catch(function(e){ console.warn('[PWA] SW registration failed:', e); });
    });
  }

  // ── Install prompt ──
  var deferredPrompt = null;
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;

  function showInstallBanner(mode) {
    if (isStandalone) return;
    if (/[?&]preview=1/.test(location.search)) return;   // coach preview
    if (localStorage.getItem('cubs_sc_install_dismissed')) return;
    if (document.getElementById('installBanner')) return;

    var banner = document.createElement('div');
    banner.id = 'installBanner';
    banner.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:500;'

    var msg = mode === 'ios'

      : '<div style="font-size:13px;color:var(--text);line-height:1.5;"><b>Install this app</b><br><span style="color:var(--text2);">Quick access from your home screen</span></div>';

    banner.innerHTML = msg
      + '<div style="display:flex;gap:8px;margin-left:auto;flex-shrink:0;">'
      + (mode==='ios' ? '' : '<button id="installBtn" style="padding:8px 14px;border-radius:8px;border:none;background:var(--blue-l);color:#fff;font-weight:600;font-size:12px;cursor:pointer;">Install</button>')
      + '<button id="installDismiss" style="padding:8px 10px;border-radius:8px;border:none;background:transparent;color:var(--text3);font-size:18px;cursor:pointer;line-height:1;">✕</button>'
      + '</div>';
    document.body.appendChild(banner);

    document.getElementById('installDismiss').onclick = function(){
      banner.remove();
      localStorage.setItem('cubs_sc_install_dismissed', '1');
    };
    if (mode !== 'ios') {
      document.getElementById('installBtn').onclick = function(){
        banner.remove();
        if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
      };
    }
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    showInstallBanner('android');
  });

  // iOS Safari has no beforeinstallprompt event — show manual instructions instead
  if (isIOS && !isStandalone) {
    setTimeout(function(){ showInstallBanner('ios'); }, 2500);
  }
})();


// ══════════════════════════════════════════════════════════════════════════
// ATHLETE PROGRAM
// ══════════════════════════════════════════════════════════════════════════
// Data: athlete_programs row → pb_state.weekData (same shape the coach's
// Program Builder saves). Logs live in completion_log, keyed the same way the
// coach dashboard reads them:
//   "wi-di-bi-ei-si"  → { weight, actual_reps, done, t }   (one set)
//   "n:wi-di-bi-ei"   → { text, t }                          (exercise note)
//   "day:wi-di"       → { done, at, date, dayLabel, week, note, pain, t }
// ei counts only exercises that have a name (same as the dashboard).
var PROG = null, ENRICH = {}, LOG = {};
var S = { week: 0, day: 0 };
var TODAY = null;             // {wi, di} for today's date if the program has a start date
var SUPA = null;
var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ytId(u){ var m = (u||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : ''; }
function lk(wi,di,bi,ei,si){ return wi+'-'+di+'-'+bi+'-'+ei+'-'+si; }
function localISO(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function pairColor(p){ return 'var(--pair-'+(p||'A')+', var(--blue-xl))'; }

// ── Prescription parsing ────────────────────────────────────────────────────
function numOnly(v){ var s = String(v == null ? '' : v).trim(); return /^\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null; }
// Target reps for set s: "8" → 8, "6ea" → 6, "(9,8,7,6)" / "5,4,3" → per set
function targetReps(ex, s){
  var r = String(ex.reps || '').trim();
  if (!r) return null;
  var list = r.replace(/[()]/g,'').split(/[,/]/).map(function(x){ return x.trim(); }).filter(Boolean);
  if (list.length > 1 && list.every(function(x){ return /^\d+/.test(x); })) {
    return parseInt(list[Math.min(s, list.length-1)]);
  }
  var m = r.match(/^(\d+)\s*(ea|each|e)?$/i);
  return m ? parseInt(m[1]) : null;
}
function repsSuffix(ex){ return /\d\s*(ea|each)\b/i.test(String(ex.reps||'')) ? ' ea' : ''; }
// ── Target loads ──
// % loads become lbs from the athlete's working 1RM: their tested 1RM at
// first, then whatever their logged sets say they can do now (TC.autoLoad).
// Today's readiness check-in can trim it (−5% yellow, −10% red).
var SESS = null;
function pbObj(){ return { weekData: PROG.weekData, startDate: PROG.startDate }; }
function sessCache(){ if (!SESS) SESS = TC.liftSessions(pbObj(), LOG); return SESS; }
function readyOf(wi, di){ return LOG['ready:' + wi + '-' + di] || null; }
function adjOf(wi, di){ var r = readyOf(wi, di); return TC.readinessAdjust(r && !r.skipped ? r.level : 'green'); }
function loadInfo(wi, di, ex){
  var a = TC.autoLoad(pbObj(), LOG, ex, wi, di, sessCache());
  if (!a || !a.lbs) return a;
  var m = adjOf(wi, di).loadMult;
  if (m !== 1) { a.beforeReady = a.lbs; a.lbs = TC.mround(a.lbs * m, 5); }
  return a;
}
function targetLoadAt(wi, di, ex){ var a = loadInfo(wi, di, ex); return a ? a.lbs : null; }
function isBodyweight(ex){ return /^\s*(bw|bodyweight|body weight)\s*$/i.test(String(ex.load||'')); }
function hasLoadField(block, ex, wi, di){
  if (block.blockType === 'speed' || block.blockType === 'esd' || block.blockType === 'mobility') return !!targetLoadAt(wi, di, ex);
  if (TC.isRunEx(block, ex)) return false;
  if (ex.distance && !ex.load) return false;
  return !isBodyweight(ex);
}
// Sets for the day (a red check-in drops one set from anything with 3+)
function effSets(wi, di, block, ex){
  var n = Math.max(1, parseInt(ex.sets) || 1);
  if (adjOf(wi, di).dropSet && n >= 3 && block.blockType !== 'mobility' && block.blockType !== 'prep') n--;
  return n;
}
// Timed sprints: speed-block runs up to 60 yd get a seconds box
function isTimedSprint(block, ex){ var ft = TC.repDistanceFt(ex); return TC.isRunEx(block, ex) && ft > 0 && ft <= 180 && TC.isHighEffort(block, ex); }
function bestTime(name){
  var best = null, target = String(name).toLowerCase();
  PROG.weekData.forEach(function(wk, wi){ (wk.days||[]).forEach(function(day, di){ (day.blocks||[]).forEach(function(b, bi){ namedExs(b).forEach(function(ex, ei){
    if (String(ex.name).toLowerCase() !== target) return;
    for (var s = 0; s < 12; s++) { var e = LOG[lk(wi,di,bi,ei,s)]; if (e && e.done && parseFloat(e.time) > 0 && (!best || parseFloat(e.time) < best)) best = parseFloat(e.time); }
  }); }); }); });
  return best;
}
function restSeconds(r){
  r = String(r || '').trim();
  if (!r) return 0;
  var m;
  if ((m = r.match(/^(\d+)\s*s(ec)?$/i))) return +m[1];
  if ((m = r.match(/^(\d+)\s*min$/i))) return +m[1] * 60;
  var parts = r.split(':');
  if (parts.length >= 2) {                     // "1:30", ":45", "01:30:00" (mm:ss:ff)
    var mm = parseInt(parts[0] || '0') || 0, ss = parseInt(parts[1] || '0') || 0;
    return mm * 60 + ss;
  }
  var n = numOnly(r); return n ? (n <= 10 ? n * 60 : n) : 0;
}
function rxLine(block, ex, li){
  var p = [];
  var sets = ex.sets ? esc(ex.sets) : '';
  var reps = ex.reps ? esc(ex.reps) : '';
  if (sets && reps) p.push('<b>'+sets+' × '+reps+'</b>'); else if (sets) p.push('<b>'+sets+' sets</b>'); else if (reps) p.push('<b>'+reps+'</b>');
  if (ex.distance) p.push(esc(ex.distance));
  var tl = li && li.lbs;
  if (tl) p.push('@ <b>'+tl+' lbs</b>');
  else if (ex.load) p.push('@ '+esc(ex.load));
  return p.join(' ');
}
function chipsHTML(ex, li){
  var c = [];
  if (li && li.lbs && li.pct) c.push(esc(li.pct)+'% of '+(li.how === 'log' ? 'est. ' : '')+'1RM');
  if (li && li.how === 'log' && li.was && Math.abs(li.lbs - li.was) >= 5 && !li.beforeReady) c.push((li.lbs > li.was ? '↑' : '↓')+' from '+li.was+' · based on your last sessions');
  if (li && li.beforeReady) c.push('↓ from '+li.beforeReady+' · today\'s check-in');
  if (ex.swappedFrom) c.push('Home swap for '+esc(ex.swappedFrom));
  if (ex.pct) c.push(esc(ex.pct)+(/%/.test(ex.pct)?'':'%')+' effort');
  if (ex.tempo && ex.tempo !== 'Tempo') c.push('Tempo '+esc(ex.tempo));
  if (ex.rest) c.push('Rest '+esc(ex.rest));
  return c.length ? '<div class="ex-chips">'+c.map(function(x){ return '<span>'+x+'</span>'; }).join('')+'</div>' : '';
}

// ── Log storage (phone first, cloud when online) ───────────────────────────
function logKey(){ return 'clog_' + PROG.id; }
function loadLocalLog(){ try { return JSON.parse(localStorage.getItem(logKey()) || '{}'); } catch(e) { return {}; } }
function mergeLogs(local, cloud){
  var out = {};
  Object.keys(cloud || {}).forEach(function(k){ out[k] = cloud[k]; });
  Object.keys(local || {}).forEach(function(k){
    var l = local[k], c = out[k];
    if (!c || !c.t || (l && l.t && l.t >= c.t) || (l && !l.t && !c.t)) out[k] = l;
  });
  return out;
}
var _saveTimer = null, _dirty = false;
function setSync(state){
  var el = document.getElementById('sync'); if (!el) return;
  el.className = 'sync' + (state === 'ok' ? ' ok' : state === 'off' ? ' off' : '');

var PREVIEW = /[?&]preview=1/.test(location.search);
if (PREVIEW) document.addEventListener('DOMContentLoaded', function(){

  b.style.cssText = 'position:sticky;top:0;z-index:50;background:#f59e0b;color:#000;font:700 12px/1.3 system-ui,sans-serif;text-align:center;padding:7px 10px;';

});
function saveLog(){
  if (PREVIEW) { setSync(''); return; }
  try { localStorage.setItem(logKey(), JSON.stringify(LOG)); localStorage.setItem('clogv_' + PROG.id, String(PROG.ver || 0)); } catch(e) {}

async function pushLog(){

}

// ── Helpers over the program ───────────────────────────────────────────────
function namedExs(block){ return (block.exercises || []).filter(function(e){ return e && e.name; }); }
function dayHasWork(day){ return TC.dayHasWork(day); }
function countDone(wi, di){
  var day = PROG.weekData[wi].days[di], tot = 0, done = 0;
  (day.blocks || []).forEach(function(b, bi){
    if (b.blockType === 'session-header') return;
    namedExs(b).forEach(function(ex, ei){
          if (ex.rtpSkip) return;
      var n = effSets(wi, di, b, ex);
      for (var s = 0; s < n; s++) { tot++; if ((LOG[lk(wi,di,bi,ei,s)] || {}).done) done++; }
    });
  });
  return { tot: tot, done: done };
}
function dayDone(wi, di){ return !!(LOG['day:'+wi+'-'+di] || {}).done; }
function dayDate(wi, di){
  if (!PROG.startDate) return null;
  var start = parseISO(PROG.startDate); if (!start) return null;
  // Week wi starts startDate + 7*wi; the day lands on its named weekday within that week
  var wkStart = new Date(start); wkStart.setDate(start.getDate() + wi * 7);
  var target = DAYS.indexOf((PROG.weekData[wi].days[di] || {}).day);
  if (target < 0) return null;
  var d = new Date(wkStart);
  var offset = (target - wkStart.getDay() + 7) % 7;
  d.setDate(wkStart.getDate() + offset);
  return d;
}
function findToday(){
  if (!PROG.startDate) return null;
  var todayStr = localISO();
  for (var wi = 0; wi < PROG.weekData.length; wi++) {
    var days = PROG.weekData[wi].days || [];
    for (var di = 0; di < days.length; di++) {
      var d = dayDate(wi, di);
      if (d && localISO(d) === todayStr) return { wi: wi, di: di };
    }
  }
  return null;
}
// Weight he used for this set the last time he did this exercise — fills the
// box when there's no % target, and is what ✓ logs on an empty set.
function lastWeight(ex, wi, di, s){
  var last = lastTime(ex.name, wi, di); if (!last) return null;
  var e = last.sets[Math.min(s, last.sets.length - 1)];
  return e && e.weight ? String(e.weight) : null;
}
// Most recent earlier log of the same exercise (by name), for "Last time"
function lastTime(name, beforeWi, beforeDi){
  var target = String(name).toLowerCase(), best = null;
  PROG.weekData.forEach(function(wk, wi){
    (wk.days || []).forEach(function(day, di){
      if (wi > beforeWi || (wi === beforeWi && di >= beforeDi)) return;
      (day.blocks || []).forEach(function(b, bi){
        namedExs(b).forEach(function(ex, ei){
          if (String(ex.name).toLowerCase() !== target) return;
          var sets = [];
          for (var s = 0; s < (parseInt(ex.sets) || 1); s++) {
            var e = LOG[lk(wi,di,bi,ei,s)];
            if (e && e.done) sets.push(e);
          }
          if (sets.length) best = { wi: wi, di: di, sets: sets };
        });
      });
    });
  });
  return best;
}

// ── Data access ─────────────────────────────────────────────────────────────
// With a permanent link (?a=) the page talks to the database only through
// locked-down functions that return/update this athlete's programs and nothing
// else. Plain ?id= links (coach preview) read the table directly, which works
// for a signed-in coach once security is on. Until the functions are installed,
// everything falls back to the direct table calls.
var RPC_READY = null;
function rpcMissing(err){ return !!err && (err.code === 'PGRST202' || err.code === '42883' || /function|schema cache/i.test(err.message || '')); }
async function rpcTry(fn, args){
  if (!LINK_TOK || RPC_READY === false) return null;
  var r = await SUPA.rpc(fn, Object.assign({ tok: LINK_TOK }, args || {}));
  if (r.error && rpcMissing(r.error)) { RPC_READY = false; return null; }
  RPC_READY = true; return r;
}
async function dbProgram(id){
  var r = await rpcTry('athlete_get_program', { pid: String(id) });
  if (r) return r.error ? r : (r.data ? r : { data: null, error: { message: 'Program not found for this link' } });
  return await SUPA.from('athlete_programs').select('*').eq('id', id).single();
}
async function dbStamp(id){
  var r = await rpcTry('athlete_program_stamp', { pid: String(id) });
  if (r) return r;
  return await SUPA.from('athlete_programs').select('updated_at').eq('id', id).single();
}
async function dbSaveLog(id, log){
  var r = await rpcTry('athlete_save_log', { pid: String(id), log: log });
  if (r) return r;
  return await SUPA.from('athlete_programs').update({ completion_log: log, completion_updated_at: new Date().toISOString() }).eq('id', id);
}

// ── Permanent athlete link (?a=<token>) ─────────────────────────────────────
// One link for the whole off-season: it looks up his programs and opens the one
// running now (else the next upcoming, else the most recent). New blocks the
// coach sends show up here automatically.
var LINK_TOK = new URLSearchParams(window.location.search).get('a') || '';
var NEXT_UP = null;
function spanOf(pb){
  if (!pb || !pb.startDate || !pb.weekData) return null;
  var s = parseISO(pb.startDate); if (!s) return null;
  var e = new Date(s); e.setDate(e.getDate() + pb.weekData.length * 7 - 1);
  return { start: pb.startDate, end: localISO(e) };
}
async function resolveAthleteLink(tok){
  var ck = 'alink_' + tok;
  try {
    if (!SUPA) SUPA = window.supabase.createClient(SUPA_URL, SUPA_KEY);
    var r = await rpcTry('athlete_link_programs', {});

function selWeek(wi){

function setNote(id, v){ LOG['n:' + id] = { text: v, t: Date.now() }; saveLog(); }
function exAt(wi, di, bi, ei){ return namedExs(PROG.weekData[wi].days[di].blocks[bi])[ei]; }
function toggleSet(wi, di, bi, ei, s){
  var k = lk(wi, di, bi, ei, s);
  var e = LOG[k] || (LOG[k] = {});
  var ex = exAt(wi, di, bi, ei);
  e.done = !e.done; e.t = Date.now(); SESS = null;
  if (e.done) {
    // Tapping ✓ on an empty set logs it as written
    var blk = PROG.weekData[wi].days[di].blocks[bi];
    var tl = targetLoadAt(wi, di, ex), tr = TC.isRunEx(blk, ex) ? null : targetReps(ex, s);
    var tw = tl || lastWeight(ex, wi, di, s);
    if (!e.weight && tw && hasLoadField(blk, ex, wi, di)) e.weight = String(tw);
    if (!e.actual_reps && tr !== null) e.actual_reps = String(tr);
    if (navigator.vibrate) navigator.vibrate(12);
  }
  saveLog();
  var row = document.getElementById('set' + k);
  if (row) {
    row.classList.toggle('done', e.done);
    row.querySelectorAll('input[data-f]').forEach(function(inp){ var f = inp.getAttribute('data-f'); if (!inp.value && e[f]) inp.value = e[f]; });
    document.getElementById('chk' + k).classList.toggle('done', e.done);
  }
  updateCounts();
  if (e.done) {
    // Rest: inside a pair, rest after the last exercise of the pair; otherwise after each set
    var exs = namedExs(PROG.weekData[wi].days[di].blocks[bi]);
    var next = exs[ei + 1];
    var inPairNotLast = ex.pair && next && next.pair === ex.pair && !next.rtpSkip;
    var secs = restSeconds(inPairNotLast ? '' : ex.rest);
    if (secs > 0) timerStart(secs, 'Rest · next: ' + nextUp(exs, ei, s));
  }

function nextUp(exs, ei, s){
  var ex = exs[ei];
  if (ex.pair) {
    var first = ei; while (first > 0 && exs[first - 1].pair === ex.pair) first--;
    var n = Math.max(1, parseInt(ex.sets) || 1);
    if (s + 1 < n) return exs[first].name + ' · set ' + (s + 2);
  } else {
    var n2 = Math.max(1, parseInt(ex.sets) || 1);
    if (s + 1 < n2) return ex.name + ' · set ' + (s + 2);
  }
  var after = exs.slice(ei + 1).find(function(x){ return x.pair !== ex.pair || !ex.pair; });
  return after ? after.name : 'next block';
}

// Rest timer
var _t = { end: 0, total: 0, iv: null };
function timerStart(secs, label){
  _t.total = secs; _t.end = Date.now() + secs * 1000;
  document.getElementById('timer-l').textContent = label || 'Rest';
  var el = document.getElementById('timer'); el.classList.add('show'); el.classList.remove('end');
  clearInterval(_t.iv); _t.iv = setInterval(timerTick, 250); timerTick();
}
function timerAdd(s){ if (_t.end) { _t.end += s * 1000; _t.total += s; timerTick(); } }
function timerStop(){ clearInterval(_t.iv); _t.end = 0; document.getElementById('timer').classList.remove('show', 'end'); }
function timerTick(){
  var left = Math.max(0, Math.round((_t.end - Date.now()) / 1000));
  document.getElementById('timer-t').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  document.getElementById('timer-bar').style.width = (_t.total ? (100 - left / _t.total * 100) : 100) + '%';
  if (left <= 0) {
    clearInterval(_t.iv);
    var el = document.getElementById('timer'); el.classList.add('end');
    document.getElementById('timer-t').textContent = 'GO';
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    setTimeout(function(){ if (!_t.end || Date.now() > _t.end + 4000) timerStop(); }, 5000);
  }
}

function saveFinish(){
  var pn = document.getElementById('f-pain-note'); if (pn) F.painNote = pn.value;
  var n = document.getElementById('f-note'); if (n) F.note = n.value;
  if (F.pain === null) { alert('Let your coach know: did anything hurt today?'); return; }

  var wi = S.week, di = S.day, day = PROG.weekData[wi].days[di];
  if (F.markRest) {
    (day.blocks || []).forEach(function(b, bi){
      if (b.blockType === 'session-header') return;

            if (!e.weight && tw && hasLoadField(b, ex, wi, di)) e.weight = String(tw);

  };
  saveLog(); pushLog();
  closeFinish(); timerStop();
  renderAll();
}

// ── Load ────────────────────────────────────────────────────────────────────
async function init(){
  var id = new URLSearchParams(window.location.search).get('id');
  if (!id && LINK_TOK) id = await resolveAthleteLink(LINK_TOK);
  if (!id) { document.getElementById('root').innerHTML = '<div class="err">' + (LINK_TOK ? 'No program here yet — your coach will send it to this link. Check back soon.' : 'No program ID in this link.') + '</div>'; return; }
  var cacheKey = 'cprog_' + id, row = null, cloudLog = null;
  try {
    SUPA = window.supabase.createClient(SUPA_URL, SUPA_KEY);
    var res = await dbProgram(id);
    if (res.error) throw new Error(res.error.message);
    row = res.data;
    cloudLog = row.completion_log || null;
    try { var slim = Object.assign({}, row); delete slim.completion_log; localStorage.setItem(cacheKey, JSON.stringify(slim)); } catch(e) {}
  } catch(err) {
    console.warn('[load] cloud failed, using saved copy:', err);
    try { row = JSON.parse(localStorage.getItem(cacheKey) || 'null'); } catch(e) {}
    if (!row) { document.getElementById('root').innerHTML = '<div class="err">Couldn\'t load your program.<br>' + esc(err.message || '') + '<br>Check your connection and reopen the link.</div>'; return; }
  }
  var pb = null;
  try { pb = typeof row.pb_state === 'string' ? JSON.parse(row.pb_state) : row.pb_state; } catch(e) {}
  if (!pb || !pb.weekData || !pb.weekData.length) { document.getElementById('root').innerHTML = '<div class="err">This program has no weeks yet. Ask your coach to re-send it.</div>'; return; }
  PROG = { id: String(id), athlete: row.athlete, name: row.name, weekData: pb.weekData, startDate: pb.startDate || null, note: pb.pushNote || row.notes || '', messages: pb.messages || [], speed: pb.speedSummary || null,
    ver: pb.structVer || 0, updatedAt: row.updated_at || null, lastChange: pb.lastChange || null, pb: pb };
  if (PROG.note && /^[a-z_]+ · \d+ weeks · /.test(PROG.note)) PROG.note = '';   // auto-generated summary, not a coach message
  PROG.profile = pb.profile || null;
  var localVer = +(localStorage.getItem('clogv_' + PROG.id) || 0);
  LOG = mergeLogs(TC.upgradeLog(loadLocalLog(), pb, localVer), cloudLog);
  try { localStorage.setItem(logKey(), JSON.stringify(LOG)); localStorage.setItem('clogv_' + PROG.id, String(PROG.ver)); } catch(e) {}

  document.title = (PROG.athlete || 'Cubs S&C') + ' — ' + (PROG.name || 'Program');
  document.getElementById('root').innerHTML = '<div id="hero"></div><div class="nav"><div class="week-row" id="week-row"></div><div class="day-row" id="day-row"></div></div><div class="session" id="session"></div>';

  TODAY = findToday();
  if (TODAY && dayHasWork(PROG.weekData[TODAY.wi].days[TODAY.di])) { S.week = TODAY.wi; S.day = TODAY.di; }
  else {
    // First unfinished training day
    var found = false;
    for (var wi = 0; wi < PROG.weekData.length && !found; wi++) {
      var days = PROG.weekData[wi].days || [];
      for (var di = 0; di < days.length; di++) {
        if (dayHasWork(days[di]) && !dayDone(wi, di)) { S.week = wi; S.day = di; found = true; break; }
      }
    }
    if (!found) { S.week = 0; S.day = Math.max(0, (PROG.weekData[0].days || []).findIndex(dayHasWork)); }
  }
  renderAll();
  setSync(navigator.onLine ? '' : 'off');
  if (/[?&]print=1/.test(location.search)) setTimeout(printProgram, 400);   // opened from the dashboard's 🖨 PDF

  try {
    var er = await SUPA.from('exercises').select('name,mechanism_text,sport_transfer,video').not('mechanism_text', 'is', null);
    (er.data || []).forEach(function(e){ ENRICH[String(e.name).toLowerCase()] = e; });
    if (er.data && er.data.length) renderSession();
  } catch(e) {}
}
// ── Print / PDF — weeks side by side ──────────────────────────────────────────
// Landscape. One table per training day: exercise, tempo and rest down the left,
// then up to 4 weeks across (sets × reps @ load) with a line to write the weight.
function printProgram(){
  if (!PROG || !PROG.weekData) return;
  var W = PROG.weekData, per = 4, pages = [];
  var nDays = Math.max.apply(null, W.map(function(w){ return (w.days || []).length; }));
  function fmt(d){ return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''; }
  function tempoOf(e){ return e && e.tempo && e.tempo !== 'Tempo' ? e.tempo : ''; }
  function exAtW(wi, di, bi, ei){ var d = (W[wi].days || [])[di], b = d && (d.blocks || [])[bi]; return b ? namedExs(b)[ei] : null; }
  for (var c = 0; c < W.length; c += per) {
    var wks = []; for (var w = c; w < Math.min(W.length, c + per); w++) wks.push(w);
    var range = wks.length > 1 ? 'Weeks ' + (wks[0] + 1) + '–' + (wks[wks.length - 1] + 1) : 'Week ' + (wks[0] + 1);
    var pg = '<div class="sb-pg"><div class="sb-hd"><div><div class="t">' + esc(PROG.athlete || '') + '</div><div class="s">' + esc(PROG.name || '') + ' · ' + range + ' of ' + W.length + '</div></div>'
      + '<div class="r">CUBS STRENGTH &amp; CONDITIONING' + (PROG.startDate ? '<br>Week 1 starts ' + fmt(parseISO(PROG.startDate)) : '') + '</div></div>';
    if (c === 0 && PROG.note) pg += '<div class="sb-msg"><b>Coach:</b> ' + esc(PROG.note) + '</div>';
    if (c === 0 && PROG.profile && (PROG.profile.goals || []).length) pg += '<div class="sb-msg" style="border-left-color:#16a34a;background:#f1faf3;"><b>Off-season goals:</b> ' + PROG.profile.goals.map(function(g){ return esc(g.goal) + ' <b>' + esc(g.target) + '</b>'; }).join(' &nbsp;·&nbsp; ') + '</div>';
    var wkW = Math.floor(58 / wks.length);
    for (var di = 0; di < nDays; di++) {
      var live = wks.filter(function(wi){ var d = (W[wi].days || [])[di]; return d && dayHasWork(d); });
      if (!live.length) continue;
      var ref = W[live[0]].days[di];
      var t = '<div class="sb-day"><div class="sb-dh">' + esc(ref.label || ref.day) + '<span>' + esc(ref.day || '') + '</span></div><table>'
        + '<colgroup><col style="width:3.5%"><col style="width:23%"><col style="width:7%"><col style="width:6%">' + wks.map(function(){ return '<col style="width:' + wkW + '%">'; }).join('') + '</colgroup>'
        + '<tr><th></th><th class="l">Exercise</th><th>Tempo</th><th>Rest</th>' + wks.map(function(wi){
            var dd = dayDate(wi, di);
            return '<th>Week ' + (wi + 1) + (W[wi].isDeload ? ' · Deload' : '') + '<span class="dl">' + (dd ? fmt(dd) : '&nbsp;') + '</span></th>';
          }).join('') + '</tr>';
      var nb = Math.max.apply(null, live.map(function(wi){ return (W[wi].days[di].blocks || []).length; }));
      for (var bi = 0; bi < nb; bi++) {
        var rb = null; live.some(function(wi){ rb = (W[wi].days[di].blocks || [])[bi]; return rb && (rb.blockType === 'session-header' || namedExs(rb).length); });
        if (!rb) continue;
        var cols = wks.length + 4;
        if (rb.blockType === 'session-header') { t += '<tr class="blk"><td colspan="' + cols + '">' + esc(rb.label || 'Session') + '</td></tr>'; continue; }
        var ne = Math.max.apply(null, live.map(function(wi){ var b = (W[wi].days[di].blocks || [])[bi]; return b ? namedExs(b).length : 0; }));
        if (!ne) continue;
        t += '<tr class="blk"><td colspan="' + cols + '">' + esc(rb.label || (rb.blockType === 'speed' ? 'Speed' : 'Lift')) + '</td></tr>';
        var counts = {};
        for (var ei = 0; ei < ne; ei++) {
          var rx = null, rbk = rb;
          live.some(function(wi){ var e = exAtW(wi, di, bi, ei); if (e) { rx = e; rbk = W[wi].days[di].blocks[bi]; } return !!e; });
          if (!rx) continue;
          var tag = rx.pair ? (counts[rx.pair] = (counts[rx.pair] || 0) + 1, rx.pair + counts[rx.pair]) : '';
          var cue = rx.rtpNote || (rx.notes && rx.notes !== rx.name ? rx.notes : '');
          t += '<tr><td class="tag">' + esc(tag) + '</td><td class="ex"><b>' + esc(rx.name) + '</b>' + (cue ? '<span class="cue">' + esc(cue) + '</span>' : '') + '</td>'
            + '<td class="mid">' + (esc(tempoOf(rx)) || '—') + '</td><td class="mid">' + (esc(rx.rest || '') || '—') + '</td>'
            + wks.map(function(wi){
                var d = (W[wi].days || [])[di], b = d && (d.blocks || [])[bi], e = exAtW(wi, di, bi, ei);
                if (!e || !dayHasWork(d)) return '<td class="na"></td>';
                var li = TC.autoLoad(pbObj(), LOG, e, wi, di, sessCache());
                var sr = [e.sets && e.reps ? e.sets + ' × ' + e.reps : (e.sets ? e.sets + ' sets' : e.reps || ''), e.distance || ''].filter(Boolean).join(' · ');
                var load = li && li.lbs ? li.lbs + ' lb' : (isBodyweight(e) ? 'BW' : (e.load || ''));
                var alt = e.name !== rx.name ? '<span class="alt">' + esc(e.name) + '</span>' : '';
                var chg = [tempoOf(e) && tempoOf(e) !== tempoOf(rx) ? 'Tempo ' + tempoOf(e) : '', e.rest && e.rest !== rx.rest ? 'Rest ' + e.rest : ''].filter(Boolean).join(' · ');
                var showW = !TC.isRunEx(b, e) && !isBodyweight(e) && b.blockType !== 'mobility' && b.blockType !== 'prep';
                return '<td class="wk">' + alt + '<b>' + (esc(sr) || '—') + '</b>' + (load ? ' <span class="ld">@ ' + esc(load) + '</span>' : '') + (chg ? '<span class="chg">' + esc(chg) + '</span>' : '') + (showW ? '<span class="wl"></span>' : '') + '</td>';
              }).join('') + '</tr>';
        }
      }
      pg += t + '</table></div>';
    }
    pages.push(pg + '<div class="sb-ft">Write the weight you used on the line under each week.</div></div>');
  }
  document.getElementById('print-root').innerHTML = pages.join('');
  var tt = document.title; document.title = (PROG.athlete || 'Program') + ' — ' + (PROG.name || 'Program');
  setTimeout(function(){ window.print(); document.title = tt; }, 150);
}

init();
</script>
